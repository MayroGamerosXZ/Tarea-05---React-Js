<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pruebas Antes de Uso - Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: '#fe6e00', workspace: '#fcfaf7', surface: '#f3f4f6' } }
            }
        }
    </script>
</head>
<body class="bg-workspace text-gray-800 font-sans p-8">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-lg border border-gray-200">
        <header class="mb-8 border-b pb-4 border-gray-200 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Checklist: Pruebas Antes de Uso</h1>
                <p class="text-gray-500">Valida que todos los módulos de "Command Center" funcionen correctamente antes de operar.</p>
            </div>
            <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-blue-200">Fase QA Inicial</span>
        </header>

        <div class="space-y-6">
            
            <section class="bg-surface p-5 rounded-md border border-gray-200">
                <h2 class="text-xl font-bold text-primary mb-3">1. Panel Principal & Branding</h2>
                <div class="space-y-2">
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" class="w-5 h-5 text-primary rounded check-item" onchange="updateProgress()">
                        <span>Visualizar logo y texto <strong>Command Center</strong> en la esquina superior izquierda.</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" class="w-5 h-5 text-primary rounded check-item" onchange="updateProgress()">
                        <span>Comprobar la <strong>Campana de Notificaciones</strong>, debe tener 1 notificación ("Sistema iniciado...").</span>
                    </label>
                </div>
            </section>

            <section class="bg-surface p-5 rounded-md border border-gray-200">
                <h2 class="text-xl font-bold text-primary mb-3">2. Módulo Vehículos</h2>
                <div class="space-y-2">
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" class="w-5 h-5 text-primary rounded check-item" onchange="updateProgress()">
                        <span>Registrar un nuevo ingreso y llenarlo (Ej: Placa ABC, Modelo XYZ).</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" class="w-5 h-5 text-primary rounded check-item" onchange="updateProgress()">
                        <span>Verificar que al guardar, se genera una <strong>notificación de éxito</strong> en la campana.</span>
                    </label>
                </div>
            </section>

            <section class="bg-surface p-5 rounded-md border border-gray-200">
                <h2 class="text-xl font-bold text-primary mb-3">3. Módulo Órdenes</h2>
                <div class="space-y-2">
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" class="w-5 h-5 text-primary rounded check-item" onchange="updateProgress()">
                        <span>Cambiar de estado el vehículo creado (Ej. de Planificado a <em>Listo</em>).</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" class="w-5 h-5 text-primary rounded check-item" onchange="updateProgress()">
                        <span>Revisar la campana de notificaciones: Debe avisar del cambio de estado.</span>
                    </label>
                </div>
            </section>

            <section class="bg-surface p-5 rounded-md border border-gray-200">
                <h2 class="text-xl font-bold text-primary mb-3">4. Módulo Inventario Avanzado</h2>
                <div class="space-y-2">
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" class="w-5 h-5 text-primary rounded check-item" onchange="updateProgress()">
                        <span>Pulsar <strong>Agregar Producto</strong> y crear uno nuevo (Ej: Aceite de motor, Stock: 10, Min: 5).</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" class="w-5 h-5 text-primary rounded check-item" onchange="updateProgress()">
                        <span>Probar botón <strong>Compra (Flecha Arriba)</strong> y ver notificación de ingreso.</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" class="w-5 h-5 text-primary rounded check-item" onchange="updateProgress()">
                        <span>Probar botón <strong>Salida (Flecha Abajo)</strong> hasta quedar por debajo del stock mínimo.</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" class="w-5 h-5 text-primary rounded check-item" onchange="updateProgress()">
                        <span>Validar la <strong>alerta roja en notificaciones</strong> cuando el producto baja del límite.</span>
                    </label>
                </div>
            </section>
        </div>

        <div class="mt-8 p-5 bg-gray-50 border border-gray-200 rounded-lg text-center">
            <h3 class="font-bold text-gray-700 mb-2">Estado de Pruebas: <span id="progress-text" class="text-primary text-2xl">0%</span></h3>
            <div class="w-full bg-gray-200 rounded-full h-4 mb-4">
                <div id="progress-bar" class="bg-primary h-4 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <button id="btn-completar" class="bg-gray-300 text-gray-500 px-6 py-2 rounded-md cursor-not-allowed font-bold" disabled>
                Certificar Sistema
            </button>
        </div>
    </div>

    <script>
        function updateProgress() {
            const checkboxes = document.querySelectorAll('.check-item');
            const checked = document.querySelectorAll('.check-item:checked');
            const percentage = Math.round((checked.length / checkboxes.length) * 100);
            
            document.getElementById('progress-bar').style.width = percentage + '%';
            document.getElementById('progress-text').innerText = percentage + '%';

            const btn = document.getElementById('btn-completar');
            if (percentage === 100) {
                btn.className = "bg-primary text-white px-6 py-2 rounded-md hover:bg-orange-600 font-bold transition-colors";
                btn.disabled = false;
                btn.onclick = () => alert('¡El Sistema "Command Center" pasó todas las pruebas y está listo para uso!');
            } else {
                btn.className = "bg-gray-300 text-gray-500 px-6 py-2 rounded-md cursor-not-allowed font-bold";
                btn.disabled = true;
            }
        }
    </script>
</body>
</html>
